# =====================================================================
#  企业工单与审批系统 —— 主配置
#  敏感信息（数据库密码）放在 application-local.yml，该文件已被 gitignore
# =====================================================================
server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: enterprise-work-order
  profiles:
    active: local
  mvc:
    # 路由不存在时抛 NoHandlerFoundException，而不是直接返回默认的 404 页面。
    # 不开启的话，GlobalExceptionHandler 里的 NoHandlerFoundException 分支永远不会触发，
    # 前端拿到的是 Spring 默认错误响应，结构与 Result 不一致。
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 本项目是纯后端接口服务，没有静态资源。关掉静态资源映射，
      # 否则任何路径都会被 ResourceHttpRequestHandler 接住，同样掩盖 404。
      add-mappings: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/enterprise_work_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
  servlet:
    multipart:
      # 【这两个值与业务上限 20MB 的关系，是本项目唯一一处刻意"两套数字"的地方】
      # Spring 这层的限制在进入 Controller 之前生效，抛的是 MaxUploadSizeExceededException，
      # 它的文案由框架生成，拿不到具体数字，用户只能看到一句"文件过大"。
      # 因此这里刻意放宽到 25MB，让 20MB~25MB 之间的请求能进到业务层，
      # 由 TicketAttachmentServiceImpl 给出"你传了 24.3MB，上限 20MB"这样的提示。
      # 而真正的恶意大文件（例如 5GB）仍会被这一层直接掐断，
      # 不会先落盘再报错，白占磁盘和带宽。
      max-file-size: 25MB
      # 整个 multipart 请求的上限要再大一些：除文件本身还有表单项、分隔符和头部开销。
      # 两者设成相等时，接近上限的文件会因为这点开销而被误判为请求过大。
      max-request-size: 30MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.enterprise.workorder.entity
  configuration:
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，学习阶段便于观察，生产环境请删除或改为 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# =====================================================================
#  自定义业务配置
# =====================================================================
# 工单导出
workorder:
  # -------------------------------------------------------------------
  #  工单附件
  # -------------------------------------------------------------------
  attachment:
    # 存储根目录。相对路径按进程工作目录解析（IDEA 里跑就是项目根目录）。
    # 刻意不放在系统临时目录：临时目录会被操作系统定期清理，
    # 文件无声消失而数据库记录还在，用户点下载得到 404 且查不出原因。
    storage-root: data/attachments
    # 单个文件业务上限。前端提示、后端校验都以它为准，Spring 那层刻意设得更大。
    max-size: 20MB
    # 允许的扩展名（不含点）。
    # 白名单而不是黑名单：黑名单永远列不全（今天想到 exe，明天冒出 chm、lnk、scf），
    # 漏一个就是一个洞；白名单的失败方式是"用户抱怨传不了某类文件"，是可发现的。
    # 刻意不含 html / svg / js：这三类即使只作为附件下载，浏览器也可能渲染并执行脚本。
    allowed-extensions:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - csv
      - png
      - jpg
      - jpeg
      - gif
      - bmp
      - zip
      - rar
      - 7z
  export:
    # 单次导出的最大行数。超过后只导出最新的这么多行，并在文件首行写明被截断。
    # 默认 100000，这里显式写出来是为了让它可被检索到 —— 只在 @Value 里写默认值时，
    # 运维和后来的人都不知道有这么一个开关。
    # 临时调小可以用来验证截断提示分支（见 e2e/e2e-export-truncate.mjs）：
    #   mvn spring-boot:run "-Dspring-boot.run.arguments=--workorder.export.max-rows=2"
    max-rows: 100000

app:
  jwt:
    # HS256 要求密钥不少于 256 位（32 字节）
    secret: enterprise-work-order-jwt-secret-key-please-change-in-production-2026
    expire-hours: 24
    header: Authorization
    prefix: "Bearer "

logging:
  level:
    root: info
    com.enterprise.workorder: debug